[package]
name = "silvercrest-contract"
version = "0.3.0"
edition = "2021"
publish = false
description = "Soroban property registry for tokenized real estate on Stellar"
repository = "https://github.com/SilverKrest/Silvercrest_contract"
license = "MIT"
keywords = ["stellar", "soroban", "real-estate"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "=21.7.7" }

[dev-dependencies]
soroban-sdk = { version = "=21.7.7" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
